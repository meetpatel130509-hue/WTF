
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Portal - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Online Course Portal</h1>
        <p>Learn Anytime, Anywhere</p>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>Student Login</h2>
            <p>Login to access your course materials.</p>

            <div id="errorMessage" class="error-message" aria-live="polite"></div>

            <form action="/login" method="POST" id="loginForm">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <div class="demo">
                <h3>Demo Login Details</h3>
                <p>Username: <strong>student</strong></p>
                <p>Password: <strong>12345</strong></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Online Course Portal</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
