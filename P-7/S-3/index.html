
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Palace Hotel - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Grand Palace Hotel</h1>
        <p>Welcome to Your Comfortable Stay</p>
    </header>

    <main class="login-container">

        <section class="login-card">
            <h2>Guest Login</h2>
            <p>Login to access the hotel reservation system.</p>

            <div id="errorMessage" class="error-message"
                 aria-live="polite"></div>

            <form action="/login" method="POST" id="loginForm">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <div class="demo">
                <h3>Demo Login Details</h3>
                <p>Username: <strong>guest</strong></p>
                <p>Password: <strong>12345</strong></p>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Grand Palace Hotel</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
